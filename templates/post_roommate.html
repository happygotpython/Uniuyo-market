<!DOCTYPE html>
<html>
<head>
    <title>UniUyo - Post Roommate Listing</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<nav class="navbar">
  <div class="logo">My Market</div>
  <ul class="nav-links">
    <li class="navbartxt"><a href="/">Home</a></li>
    <li class="navbartxt"><a href="/shop">Shop</a></li>
    <li class="navbartxt"><a href="/roommates">Roommates</a></li>
    <li class="navbartxt"><a href="/login">Login</a></li>
    <li class="navbartxt"><a href="/signup">Sign Up</a></li>
    <li><button id="theme-toggle">🌙</button></li>
  </ul>
</nav>

<h1>Post a Roommate Listing</h1>

<form method="POST" action="/post-roommate">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" required>

  <label for="level">Level:</label>
  <select id="level" name="level" required>
    <option value="100L">100L</option>
    <option value="200L">200L</option>
    <option value="300L">300L</option>
    <option value="400L">400L</option>
    <option value="500L">500L</option>
  </select>

  <label for="bio">Bio:</label>
  <textarea id="bio" name="bio" rows="4" placeholder="Tell others about yourself..."></textarea>

  <label for="contact">Contact (email or phone):</label>
  <input type="text" id="contact" name="contact" required>

  <br><br>
  <a href="/roommates"><button type="submit" class="login-btn">Post Listing</button></a>
</form>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
