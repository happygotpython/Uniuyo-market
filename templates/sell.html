<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell Your Items</title>
</head>
<body>
    <h1>Sell Your Items</h1>
    <form action="/sell" method="post">
        <label for="item-name">Item Name:</label>
        <input type="text" id="item-name" name="item-name" required>
        <br><br>
        <label for="item-description">Description:</label>
        <textarea id="item-description" name="item-description" required></textarea>
        <br><br>
        <label for="item-price">Price:</label>
        <input type="number" id="item-price" name="item-price" step="0.01" required>
        <br><br>
        <label for="item-image">Image:</label>
        <input type="file" id="item-image" name="item-image" accept="image/*">
        <br><br>
        <button type="submit">List Item</button>
    </form>
</body>
</html>`
